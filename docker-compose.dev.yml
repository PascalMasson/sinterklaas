services:
  app:
    env_file:
      - '${DEVCTL_RUNTIME_ENV:-.env}'
    extra_hosts:
      - "${DEVCTL_APP_HOST:-sinterklaas.test}:127.0.0.1"
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    environment:
      PHP_OPCACHE_ENABLE: 1
      PHP_IDE_CONFIG: "serverName=Sinterklaas"
      BASIC_AUTH_ENABLE: 0
      BASIC_AUTH_USERNAME: sinterklaas
      BASIC_AUTH_PASSWORD: staging
    # ports:
    #   - '${APP_PORT:-80}:8080'
    #   - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
      - web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'
      - 'traefik.http.routers.${DEVCTL_APP_ROUTER:-sinterklaas}.rule=Host(`${DEVCTL_APP_HOST:-sinterklaas.test}`)'
      - 'traefik.http.routers.${DEVCTL_APP_ROUTER:-sinterklaas}.entrypoints=https'
      - 'traefik.http.routers.${DEVCTL_APP_ROUTER:-sinterklaas}.tls=true'
      - 'traefik.http.routers.${DEVCTL_APP_ROUTER:-sinterklaas}.service=${DEVCTL_APP_ROUTER:-sinterklaas}@docker'
      - 'traefik.http.services.${DEVCTL_APP_ROUTER:-sinterklaas}.loadbalancer.server.port=8080'
    depends_on:
      - mariadb
      - redis
      - phpmyadmin
      - meilisearch
      - mailpit
  meilisearch:
    image: getmeili/meilisearch:v0.30.0
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
    volumes:
      - 'sail-meilisearch:/data.ms'
    networks:
      - sail
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      retries: 3
      timeout: 5s
  mailpit:
    image: 'axllent/mailpit:latest'
    networks:
      - sail
  mariadb:
    image: 'mariadb:10'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - 'sail-mariadb:/var/lib/mysql'
      - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD}'
      retries: 3
      timeout: 5s
  redis:
    image: 'redis:alpine'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
  phpmyadmin:
    image: 'phpmyadmin:latest'
    networks:
      - sail
      - web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'
      - 'traefik.http.routers.${DEVCTL_PMA_ROUTER:-sinterklaas-phpmyadmin}.rule=Host(`${DEVCTL_PMA_HOST:-pma-sinterklaas.test}`)'
      - 'traefik.http.routers.${DEVCTL_PMA_ROUTER:-sinterklaas-phpmyadmin}.entrypoints=https'
      - 'traefik.http.routers.${DEVCTL_PMA_ROUTER:-sinterklaas-phpmyadmin}.tls=true'
      - 'traefik.http.services.${DEVCTL_PMA_ROUTER:-sinterklaas-phpmyadmin}.loadbalancer.server.port=80'
    environment:
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=${DB_PASSWORD}
      - UPLOAD_LIMIT=1G
networks:
  sail:
    driver: bridge
  web:
    external: true
volumes:
  sail-mariadb:
    driver: local
  sail-redis:
    driver: local
  sail-meilisearch:
    driver: local
